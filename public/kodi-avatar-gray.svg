<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 42 220 220" role="img" aria-label="Kodi, Kodfolyo maskotu (gri, göz kırpan)">
  <defs>
    <radialGradient id="kodi-avatar-gray-body" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#D4D4D8" />
      <stop offset="55%" stop-color="#A1A1AA" />
      <stop offset="100%" stop-color="#71717A" />
    </radialGradient>
    <radialGradient id="kodi-avatar-gray-belly" cx="42%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </radialGradient>
    <radialGradient id="kodi-avatar-gray-ear" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </radialGradient>
  </defs>

  <!-- Not: viewBox "25 42 220 220" — karakterin gerçek görsel sınırlarına (x 39-230,
       y 57-246) göre eşit boşluklu, KARE bir kırpma alanı. Eskiden viewBox 240x254
       (kare değil, merkezi 120,127) idi ama karakterin ağırlık merkezi kuyruk+gölge
       yüzünden 134,151'de — kare bir avatar kutusunda object-cover bunu sağa/aşağı
       kaydırıyordu. Bu viewBox karakteri gerçekten ortalar. -->

  <ellipse cx="120" cy="236" rx="64" ry="10" fill="#191720" opacity=".1" />

  <path d="M186 182 C224 178 230 136 206 122" fill="none" stroke="url(#kodi-avatar-gray-body)" stroke-width="13" stroke-linecap="round" />
  <circle cx="206" cy="122" r="9" fill="#71717A" />

  <circle cx="68" cy="84" r="27" fill="url(#kodi-avatar-gray-body)" />
  <circle cx="172" cy="84" r="27" fill="url(#kodi-avatar-gray-body)" />
  <circle cx="68" cy="86" r="13" fill="url(#kodi-avatar-gray-ear)" />
  <circle cx="172" cy="86" r="13" fill="url(#kodi-avatar-gray-ear)" />

  <ellipse cx="120" cy="146" rx="80" ry="74" fill="url(#kodi-avatar-gray-body)" />
  <ellipse cx="120" cy="166" rx="52" ry="46" fill="url(#kodi-avatar-gray-belly)" />

  <ellipse cx="54" cy="188" rx="15" ry="12" fill="url(#kodi-avatar-gray-body)" />
  <ellipse cx="186" cy="188" rx="15" ry="12" fill="url(#kodi-avatar-gray-body)" />
  <ellipse cx="96" cy="212" rx="19" ry="12" fill="url(#kodi-avatar-gray-body)" />
  <ellipse cx="144" cy="212" rx="19" ry="12" fill="url(#kodi-avatar-gray-body)" />

  <circle cx="70" cy="152" r="9" fill="#A1A1AA" opacity=".6" />
  <circle cx="170" cy="152" r="9" fill="#A1A1AA" opacity=".6" />

  <!-- sol göz: kırpık (kapalı) — Kodi.tsx'teki "happy" göz eğrisiyle aynı şekil -->
  <path d="M82 134 q12 -18 24 0" fill="none" stroke="#191720" stroke-width="7" stroke-linecap="round" />

  <!-- sağ göz: açık, bakan -->
  <circle cx="146" cy="132" r="24" fill="#FBFAF7" />
  <circle cx="151" cy="136" r="11" fill="#191720" />
  <circle cx="145" cy="128" r="4.5" fill="#FBFAF7" />

  <!-- gülümseme -->
  <path d="M100 164 q20 18 40 0" fill="none" stroke="#52525B" stroke-width="5" stroke-linecap="round" />
</svg>
